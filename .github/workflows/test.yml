name: Tests

on:
  [push, pull_request]

defaults:
  run:
    shell: bash

jobs:

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"
          args: "check --fix-only --exit-non-zero-on-fix"
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
        with:
          msg: '[pre-commit.ci lite] apply automatic fixes for ruff linting errors'

  unit-test:
    needs: [ruff]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: [
          '3.12',
          '3.13',
          '3.14',
          '3.15-dev',
        ]

    env:
      BUILD_WHEEL: ${{ matrix.python-version == '3.12' && 'true' || '' }}
      EXPERIMENTAL: ${{ endsWith(matrix.python-version, '-dev') && 'true' || '' }}

    continue-on-error: ${{ endsWith(matrix.python-version, '-dev') }}

    steps:

      - name: Obtain SasData source from git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/test.yml
            **/requirements*.txt

      ### Build sasdata sdist and wheel
      - name: Allow use of scientific-python nightly wheels for experimental builds
        if: env.EXPERIMENTAL
        run: |
          # Enable the scientific-python-nightly wheels as primary source
          echo "PIP_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" >> $GITHUB_ENV
          # with a fallback to regular pypi (since most wheels will not be there)
          echo "PIP_EXTRA_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV
          # and we will need to permit prereleases for the nightly wheels
          echo "PIP_PRE=true" >> $GITHUB_ENV

      - name: Build sasdata
        if: env.BUILD_WHEEL
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python -m pip install dist/sasdata*whl

      - name: Publish sdist and wheel package
        if: env.BUILD_WHEEL
        uses: actions/upload-artifact@v7
        with:
          name: sasdata-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            dist/sasdata*whl
            dist/sasdata*tar*
          if-no-files-found: ignore

      ### Installation of test-dependencies

      - name: Install Python dependencies (test)
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt

      ### Test sasdata

      - name: Test with pytest
        run: |
          python -m pytest -v -s test

  publish-to-pypi:
    name: Publish to pypi
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - unit-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sasdata
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          path: |
           dist/sasdata*whl
           dist/sasdata*tar*
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
